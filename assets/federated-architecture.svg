<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CareFed federated architecture</title>
  <desc id="desc">Architecture diagram showing hospital and home-care nodes, local training, privacy handling, secure aggregation, robust aggregation, global model evaluation, fairness audit, explainability, and ledger verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640">
      <stop stop-color="#F8FAFC" />
      <stop offset="1" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="1280" height="640" rx="30" fill="url(#bg)" />
  <text x="70" y="76" fill="#0F172A" font-family="Inter,Segoe UI,Arial" font-size="30" font-weight="900">Federated connected-health learning architecture</text>
  <text x="70" y="106" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="16">Raw synthetic patient-level records remain at sites; only model updates move through privacy, aggregation, and audit layers.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial">
    <rect x="70" y="166" width="210" height="86" rx="22" fill="#FFFFFF" />
    <text x="98" y="201" fill="#0F172A" font-size="18" font-weight="900">Hospital 01</text>
    <text x="98" y="226" fill="#64748B" font-size="13">Local clinical telemetry</text>

    <rect x="70" y="282" width="210" height="86" rx="22" fill="#FFFFFF" />
    <text x="98" y="317" fill="#0F172A" font-size="18" font-weight="900">Hospital 02</text>
    <text x="98" y="342" fill="#64748B" font-size="13">Local PyTorch training</text>

    <rect x="70" y="398" width="210" height="86" rx="22" fill="#FFFFFF" />
    <text x="98" y="433" fill="#0F172A" font-size="18" font-weight="900">Home-care node</text>
    <text x="98" y="458" fill="#64748B" font-size="13">Distributed observations</text>

    <rect x="370" y="240" width="180" height="170" rx="26" fill="#ECFEFF" stroke="#06B6D4" />
    <text x="402" y="284" fill="#0F172A" font-size="18" font-weight="900">Privacy layer</text>
    <text x="402" y="316" fill="#475569" font-size="13">Update clipping</text>
    <text x="402" y="342" fill="#475569" font-size="13">DP-style noise</text>
    <text x="402" y="368" fill="#475569" font-size="13">Approx. epsilon</text>

    <rect x="630" y="240" width="196" height="170" rx="26" fill="#F0FDF4" stroke="#10B981" />
    <text x="658" y="284" fill="#0F172A" font-size="18" font-weight="900">Aggregation</text>
    <text x="658" y="316" fill="#475569" font-size="13">Secure FedAvg</text>
    <text x="658" y="342" fill="#475569" font-size="13">Median / trimmed mean</text>
    <text x="658" y="368" fill="#475569" font-size="13">Malicious-client tests</text>

    <rect x="910" y="168" width="230" height="100" rx="24" fill="#EEF2FF" stroke="#818CF8" />
    <text x="942" y="206" fill="#0F172A" font-size="18" font-weight="900">Global model</text>
    <text x="942" y="232" fill="#475569" font-size="13">Shared risk predictor</text>

    <rect x="910" y="300" width="230" height="100" rx="24" fill="#FFF7ED" stroke="#FB923C" />
    <text x="942" y="338" fill="#0F172A" font-size="18" font-weight="900">Trust evaluation</text>
    <text x="942" y="364" fill="#475569" font-size="13">Calibration + fairness</text>

    <rect x="910" y="432" width="230" height="100" rx="24" fill="#FDF2F8" stroke="#F472B6" />
    <text x="942" y="470" fill="#0F172A" font-size="18" font-weight="900">Audit outputs</text>
    <text x="942" y="496" fill="#475569" font-size="13">Ledger + explanations</text>
  </g>

  <g stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 209 C318 209 326 288 370 288" />
    <path d="M280 325 L370 325" />
    <path d="M280 441 C318 441 326 362 370 362" />
    <path d="M550 325 L630 325" />
    <path d="M826 306 C872 260 865 218 910 218" />
    <path d="M826 350 L910 350" />
    <path d="M826 374 C872 428 865 482 910 482" />
  </g>

  <g fill="#0EA5E9">
    <circle cx="366" cy="288" r="5" />
    <circle cx="366" cy="325" r="5" />
    <circle cx="366" cy="362" r="5" />
    <circle cx="626" cy="325" r="5" />
    <circle cx="906" cy="218" r="5" />
    <circle cx="906" cy="350" r="5" />
    <circle cx="906" cy="482" r="5" />
  </g>

  <rect x="70" y="548" width="1070" height="44" rx="22" fill="#0F172A" />
  <text x="102" y="576" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="800">Research boundary:</text>
  <text x="250" y="576" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="15">synthetic data only · no clinical deployment claim · secure aggregation is a scoped teaching prototype</text>
</svg>
