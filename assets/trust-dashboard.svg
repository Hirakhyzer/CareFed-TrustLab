<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CareFed TrustLab dashboard preview</title>
  <desc id="desc">Dashboard mockup showing federated health AI metrics, privacy utility, subgroup audit, and ledger verification.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="720">
      <stop stop-color="#F8FAFC" />
      <stop offset="1" stop-color="#ECFEFF" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#page)" />
  <rect x="40" y="38" width="1200" height="644" rx="28" fill="#0F172A" filter="url(#soft)" />
  <rect x="64" y="62" width="1152" height="596" rx="24" fill="#F8FAFC" />

  <rect x="64" y="62" width="250" height="596" rx="24" fill="#111827" />
  <text x="92" y="112" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="900">CareFed</text>
  <text x="92" y="140" fill="#94A3B8" font-family="Inter,Segoe UI,Arial" font-size="13">TrustLab console</text>

  <g font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">
    <rect x="88" y="190" width="180" height="42" rx="14" fill="#0EA5E9" fill-opacity="0.25" />
    <text x="112" y="217" fill="#E0F2FE">Experiment overview</text>
    <text x="112" y="272" fill="#CBD5E1">Privacy sweep</text>
    <text x="112" y="326" fill="#CBD5E1">Fairness audit</text>
    <text x="112" y="380" fill="#CBD5E1">Robustness tests</text>
    <text x="112" y="434" fill="#CBD5E1">Audit ledger</text>
  </g>

  <text x="350" y="112" fill="#0F172A" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="900">Federated Trust Dashboard</text>
  <text x="350" y="142" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="15">Synthetic connected-health experiment summary</text>

  <g filter="url(#soft)">
    <rect x="350" y="176" width="185" height="108" rx="22" fill="url(#card)" />
    <rect x="563" y="176" width="185" height="108" rx="22" fill="url(#card)" />
    <rect x="776" y="176" width="185" height="108" rx="22" fill="url(#card)" />
    <rect x="989" y="176" width="185" height="108" rx="22" fill="url(#card)" />
  </g>

  <g font-family="Inter,Segoe UI,Arial">
    <text x="374" y="212" fill="#64748B" font-size="13" font-weight="700">ROC-AUC</text>
    <text x="374" y="252" fill="#0F172A" font-size="34" font-weight="900">0.91</text>
    <text x="374" y="270" fill="#10B981" font-size="12" font-weight="800">held-out test</text>

    <text x="587" y="212" fill="#64748B" font-size="13" font-weight="700">ECE</text>
    <text x="587" y="252" fill="#0F172A" font-size="34" font-weight="900">0.04</text>
    <text x="587" y="270" fill="#0EA5E9" font-size="12" font-weight="800">calibration</text>

    <text x="800" y="212" fill="#64748B" font-size="13" font-weight="700">Approx. ε</text>
    <text x="800" y="252" fill="#0F172A" font-size="34" font-weight="900">3.2</text>
    <text x="800" y="270" fill="#F59E0B" font-size="12" font-weight="800">privacy sweep</text>

    <text x="1013" y="212" fill="#64748B" font-size="13" font-weight="700">Ledger</text>
    <text x="1013" y="252" fill="#0F172A" font-size="34" font-weight="900">OK</text>
    <text x="1013" y="270" fill="#10B981" font-size="12" font-weight="800">hash verified</text>
  </g>

  <g filter="url(#soft)">
    <rect x="350" y="320" width="390" height="278" rx="24" fill="url(#card)" />
    <rect x="774" y="320" width="400" height="278" rx="24" fill="url(#card)" />
  </g>

  <text x="382" y="364" fill="#0F172A" font-family="Inter,Segoe UI,Arial" font-size="19" font-weight="900">Privacy-utility curve</text>
  <line x1="392" y1="543" x2="700" y2="543" stroke="#CBD5E1" stroke-width="2" />
  <line x1="392" y1="400" x2="392" y2="543" stroke="#CBD5E1" stroke-width="2" />
  <path d="M404 424 C450 420 478 435 520 456 S601 508 692 524" stroke="#0EA5E9" stroke-width="5" fill="none" stroke-linecap="round" />
  <circle cx="405" cy="424" r="6" fill="#0EA5E9" />
  <circle cx="520" cy="456" r="6" fill="#0EA5E9" />
  <circle cx="692" cy="524" r="6" fill="#0EA5E9" />
  <text x="402" y="576" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="12">Lower noise</text>
  <text x="604" y="576" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="12">Higher privacy</text>

  <text x="808" y="364" fill="#0F172A" font-family="Inter,Segoe UI,Arial" font-size="19" font-weight="900">Subgroup audit</text>
  <g>
    <rect x="814" y="407" width="270" height="24" rx="12" fill="#E0F2FE" />
    <rect x="814" y="407" width="214" height="24" rx="12" fill="#0EA5E9" />
    <text x="1098" y="425" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="12">Age band</text>
    <rect x="814" y="455" width="270" height="24" rx="12" fill="#DCFCE7" />
    <rect x="814" y="455" width="232" height="24" rx="12" fill="#10B981" />
    <text x="1098" y="473" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="12">Sex</text>
    <rect x="814" y="503" width="270" height="24" rx="12" fill="#FEF3C7" />
    <rect x="814" y="503" width="188" height="24" rx="12" fill="#F59E0B" />
    <text x="1098" y="521" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="12">Care setting</text>
  </g>

  <rect x="92" y="540" width="166" height="68" rx="18" fill="#F0FDFA" fill-opacity="0.12" stroke="#2DD4BF" />
  <text x="112" y="568" fill="#CCFBF1" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Mode</text>
  <text x="112" y="590" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="900">Research only</text>
</svg>
