<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CareFed research workflow</title>
  <desc id="desc">Workflow diagram from synthetic data generation through patient split, training-only preprocessing, federated training, validation thresholding, held-out testing, trust audit, and artifact export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520">
      <stop stop-color="#082F49" />
      <stop offset="1" stop-color="#064E3B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.24" />
    </filter>
  </defs>
  <rect width="1280" height="520" rx="30" fill="url(#bg)" />
  <text x="70" y="72" fill="#ECFEFF" font-family="Inter,Segoe UI,Arial" font-size="30" font-weight="900">Leakage-aware research workflow</text>
  <text x="70" y="104" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial" font-size="16">Each stage is designed to keep evaluation auditable, reproducible, and academically defensible.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial">
    <rect x="66" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="92" y="207" fill="#0F172A" font-size="16" font-weight="900">Synthetic</text>
    <text x="92" y="229" fill="#0F172A" font-size="16" font-weight="900">cohort</text>
    <text x="92" y="258" fill="#64748B" font-size="12">No real patient data</text>

    <rect x="234" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="260" y="207" fill="#0F172A" font-size="16" font-weight="900">Patient-level</text>
    <text x="260" y="229" fill="#0F172A" font-size="16" font-weight="900">split</text>
    <text x="260" y="258" fill="#64748B" font-size="12">Train / val / test</text>

    <rect x="402" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="428" y="207" fill="#0F172A" font-size="16" font-weight="900">Safe</text>
    <text x="428" y="229" fill="#0F172A" font-size="16" font-weight="900">scaling</text>
    <text x="428" y="258" fill="#64748B" font-size="12">Fit on train only</text>

    <rect x="570" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="596" y="207" fill="#0F172A" font-size="16" font-weight="900">Federated</text>
    <text x="596" y="229" fill="#0F172A" font-size="16" font-weight="900">rounds</text>
    <text x="596" y="258" fill="#64748B" font-size="12">Local site training</text>

    <rect x="738" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="764" y="207" fill="#0F172A" font-size="16" font-weight="900">Validation</text>
    <text x="764" y="229" fill="#0F172A" font-size="16" font-weight="900">threshold</text>
    <text x="764" y="258" fill="#64748B" font-size="12">Fixed before test</text>

    <rect x="906" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="932" y="207" fill="#0F172A" font-size="16" font-weight="900">Held-out</text>
    <text x="932" y="229" fill="#0F172A" font-size="16" font-weight="900">testing</text>
    <text x="932" y="258" fill="#64748B" font-size="12">Evaluate once</text>

    <rect x="1074" y="166" width="142" height="120" rx="22" fill="#F8FAFC" />
    <text x="1100" y="207" fill="#0F172A" font-size="16" font-weight="900">Trust</text>
    <text x="1100" y="229" fill="#0F172A" font-size="16" font-weight="900">bundle</text>
    <text x="1100" y="258" fill="#64748B" font-size="12">Metrics + ledger</text>
  </g>

  <g stroke="#67E8F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M208 226 H234" />
    <path d="M376 226 H402" />
    <path d="M544 226 H570" />
    <path d="M712 226 H738" />
    <path d="M880 226 H906" />
    <path d="M1048 226 H1074" />
  </g>
  <g fill="#67E8F9">
    <path d="M226 217 L238 226 L226 235" />
    <path d="M394 217 L406 226 L394 235" />
    <path d="M562 217 L574 226 L562 235" />
    <path d="M730 217 L742 226 L730 235" />
    <path d="M898 217 L910 226 L898 235" />
    <path d="M1066 217 L1078 226 L1066 235" />
  </g>

  <g font-family="Inter,Segoe UI,Arial">
    <rect x="96" y="348" width="1088" height="78" rx="24" fill="#ECFEFF" fill-opacity="0.12" stroke="#67E8F9" stroke-opacity="0.7" />
    <text x="128" y="385" fill="#ECFEFF" font-size="16" font-weight="900">Reporting standard</text>
    <text x="128" y="410" fill="#BAE6FD" font-size="14">Record configuration, seeds, data generator parameters, attack setting, aggregation method, threshold rule, metrics, subgroup results, limitations, and ledger verification.</text>
  </g>
</svg>
