name: Research reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime packages
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas scikit-learn scipy torch matplotlib
      - name: Run deterministic smoke check
        run: PYTHONPATH=src python -c "from carefed.checks import run_smoke_checks; print(run_smoke_checks())"
